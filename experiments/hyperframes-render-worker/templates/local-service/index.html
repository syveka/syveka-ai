<!doctype html>
<html lang="__LANG__" dir="__DIR__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      html,
      body {
        width: __WIDTH__px;
        height: __HEIGHT__px;
      }
      #root {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: 42% 58%;
      }
      #root[data-aspect="1x1"] {
        grid-template-rows: 36% 64%;
      }
      /* Side by side on landscape; the grid follows dir, so the media swaps sides in Arabic. */
      #root[data-aspect="16x9"] {
        grid-template-rows: 100%;
        grid-template-columns: 44% 56%;
      }
      #media-frame {
        position: relative;
        overflow: hidden;
        background: var(--accent);
        min-height: 0;
      }
      #panel {
        padding: var(--pad);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: calc(var(--unit) * 3);
        align-items: flex-start;
        min-height: 0;
        min-width: 0;
      }
      #panel .headline {
        font-size: calc(var(--unit) * 8.6);
      }
      #root[data-aspect="1x1"] #panel {
        padding-block: calc(var(--unit) * 4);
        gap: calc(var(--unit) * 2);
      }
      #root[data-aspect="1x1"] #panel .headline {
        font-size: calc(var(--unit) * 7.4);
      }
      #root[data-aspect="1x1"] .description {
        font-size: calc(var(--unit) * 3.4);
      }
      #root[data-aspect="16x9"] .description {
        font-size: calc(var(--unit) * 3.4);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-aspect="__ASPECT__"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="__WIDTH__"
      data-height="__HEIGHT__"
    >
      <div id="media-frame"><!--MEDIA_SLOT--></div>
      <div id="panel">
        <div class="brand-row" id="brand-row">
          <img id="logo" class="logo" alt="" />
          <div id="brand" class="brand"></div>
        </div>
        <h1 id="headline" class="headline"></h1>
        <p id="description" class="description"></p>
        <div id="cta" class="cta"></div>
      </div>
    </div>
    <script id="job-data" type="application/json">
      __JOB_DATA__
    </script>
    <script src="assets/base.js"></script>
    <script>
      (function () {
        const { fitCopy, enter, drift, fadeOutAll, timeline } = window.SyvekaTemplate;
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = timeline;
        drift("#media");
        enter("#brand-row", 0.3);
        enter("#headline", 0.9);
        enter("#description", 1.9);
        enter("#cta", 3, 0.6, 24);
        fadeOutAll("#root");
        document.fonts.ready.then(() => fitCopy("#panel"));
      })();
    </script>
  </body>
</html>
