<!doctype html>
<html lang="__LANG__" dir="__DIR__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      html,
      body {
        width: __WIDTH__px;
        height: __HEIGHT__px;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #band {
        position: absolute;
        inset-block-start: 0;
        inset-inline-start: 0;
        width: calc(var(--unit) * 2.4);
        height: 100%;
        background: var(--accent);
      }
      #content {
        position: absolute;
        inset: var(--pad);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: calc(var(--unit) * 4);
        align-items: flex-start;
      }
      #media-frame {
        width: 100%;
        height: 30%;
        flex: none;
        overflow: hidden;
        border-radius: calc(var(--unit) * 3);
      }
      #media-frame:empty {
        display: none;
      }
      #root[data-aspect="1x1"] #media-frame {
        height: 26%;
      }
      #root[data-aspect="1x1"] #content {
        gap: calc(var(--unit) * 2.6);
      }
      #root[data-aspect="1x1"] .headline {
        font-size: calc(var(--unit) * 8.6);
      }
      #root[data-aspect="1x1"] .description {
        font-size: calc(var(--unit) * 3.4);
      }
      #root[data-aspect="16x9"] #media-frame {
        position: absolute;
        inset-block: 0;
        inset-inline-end: 0;
        width: 38%;
        height: 100%;
      }
      #root[data-aspect="16x9"] #copy {
        max-width: 56%;
      }
      #root[data-aspect="16x9"] .headline {
        font-size: calc(var(--unit) * 8.6);
      }
      #root[data-aspect="16x9"] .description {
        font-size: calc(var(--unit) * 3.4);
      }
      #copy {
        display: flex;
        flex-direction: column;
        gap: calc(var(--unit) * 3);
        align-items: flex-start;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-aspect="__ASPECT__"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="__WIDTH__"
      data-height="__HEIGHT__"
    >
      <div id="band"></div>
      <div id="content">
        <div class="brand-row" id="brand-row">
          <img id="logo" class="logo" alt="" />
          <div id="brand" class="brand"></div>
        </div>
        <div id="media-frame"><!--MEDIA_SLOT--></div>
        <div id="copy">
          <h1 id="headline" class="headline"></h1>
          <p id="description" class="description"></p>
          <div id="cta" class="cta"></div>
        </div>
      </div>
    </div>
    <script id="job-data" type="application/json">
      __JOB_DATA__
    </script>
    <script src="assets/base.js"></script>
    <script>
      (function () {
        const { fitCopy, enter, drift, fadeOutAll, timeline } = window.SyvekaTemplate;
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = timeline;
        drift("#media");
        enter("#band", 0, 0.5, 0);
        enter("#brand-row", 0.3);
        enter("#media-frame", 0.6);
        enter("#headline", 1.1, 0.8, 60);
        enter("#description", 2.2);
        enter("#cta", 3.4, 0.6, 24);
        fadeOutAll("#root");
        document.fonts.ready.then(() => fitCopy("#content"));
      })();
    </script>
  </body>
</html>
