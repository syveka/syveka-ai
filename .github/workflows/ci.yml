name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci

  prisma-generate:
    name: Prisma generate
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate

  prisma-validate:
    name: Prisma validate
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

  migration-structure:
    name: Migration structure validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate migration directory structure
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d prisma/migrations ]; then
            echo "No prisma/migrations directory found; no migration files to validate."
            exit 0
          fi

          if [ ! -f prisma/migrations/migration_lock.toml ]; then
            echo "prisma/migrations/migration_lock.toml is required when migrations exist."
            exit 1
          fi

          found=0
          while IFS= read -r -d '' dir; do
            name="$(basename "$dir")"
            if [ "$name" = "migrations" ]; then
              continue
            fi

            found=1
            if [[ ! "$name" =~ ^[0-9]{14}_[A-Za-z0-9_]+$ ]]; then
              echo "Invalid Prisma migration directory name: $name"
              exit 1
            fi

            if [ ! -f "$dir/migration.sql" ]; then
              echo "Missing migration.sql in $dir"
              exit 1
            fi

            if [ ! -s "$dir/migration.sql" ]; then
              echo "Empty migration.sql in $dir"
              exit 1
            fi
          done < <(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)

          if [ "$found" -eq 0 ]; then
            echo "prisma/migrations exists but contains no migration directories."
          fi
      - name: Verify migration order and published checksums
        run: node scripts/check-migration-history.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [prisma-generate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check || npx prettier --check .

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: [prisma-generate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run typecheck
        run: npm run typecheck

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: [prisma-generate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run unit and integration tests
        run: npm test

  rls:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    needs: [prisma-generate]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy complete migration history to empty PostgreSQL
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/staging/release-invariants.sql
          # The deprecated Calendar/Booking wrapper is intentionally rerunnable.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/sql/005_calendar_booking_rls.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/sql/005_calendar_booking_rls.sql
      - name: Run isolation assertions
        run: |
          bash scripts/ci/run-rls-check.sh iso tests/rls/isolation-grants.sql tests/rls/isolation-revokes.sql tests/rls/isolation-fixtures.sql tests/rls/isolation-cleanup.sql tests/rls/isolation.sql tests/rls/isolation-grants-verify.sql
          bash scripts/ci/run-rls-check.sh cal tests/rls/calendar-booking-grants.sql tests/rls/calendar-booking-revokes.sql tests/rls/calendar-booking-fixtures.sql tests/rls/calendar-booking-cleanup.sql tests/rls/calendar-booking-isolation.sql tests/rls/calendar-booking-grants-verify.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/integration/tenant-relationship-integrity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/migrations/match-chunks-eligibility.sql
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

  rls-non-superuser:
    name: RLS isolation tests (non-superuser Supabase-like role)
    runs-on: ubuntu-latest
    needs: [prisma-generate]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Supabase's own direct database role is intentionally not a Postgres
      # superuser; the "Verify database RLS and tenant invariants" staging step runs
      # under exactly this kind of restricted role, which is what actually failed
      # (permission denied to set role "authenticated_test"). This job reproduces
      # that role shape -- LOGIN, CREATEROLE only, no SUPERUSER, no BYPASSRLS -- to
      # keep the fix honest instead of only ever testing as the superuser the other
      # CI jobs use.
      # Two distinct admin URLs, each already pointed at the exact database it's
      # used for -- never combined with a `-d dbname` flag, which would silently
      # override just the dbname parameter and drop the URL's host/port, falling
      # back to a local Unix socket that doesn't exist on the runner.
      PGADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGADMIN_TARGET_URL: postgresql://postgres:postgres@localhost:5432/rls_non_superuser
      DATABASE_URL: postgresql://supabase_like:supabase_like@localhost:5432/rls_non_superuser
      DIRECT_URL: postgresql://supabase_like:supabase_like@localhost:5432/rls_non_superuser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Provision a non-superuser, Supabase-like execution role
        run: |
          set -euo pipefail
          psql "$PGADMIN_URL" -v ON_ERROR_STOP=1 -c "create role authenticated nologin"
          psql "$PGADMIN_URL" -v ON_ERROR_STOP=1 -c "create role supabase_like login password 'supabase_like' createrole nosuperuser nobypassrls"
          psql "$PGADMIN_URL" -v ON_ERROR_STOP=1 -c "create database rls_non_superuser owner supabase_like"
          # pgvector's CREATE EXTENSION requires a superuser; everything after this
          # runs as supabase_like, which owns the resulting database (and, per
          # PostgreSQL 15's pg_database_owner default, its public schema) but is
          # never granted SUPERUSER or BYPASSRLS. Each of these targets
          # rls_non_superuser through its own dedicated URL, not by combining
          # PGADMIN_URL with a -d flag.
          psql "$PGADMIN_TARGET_URL" -v ON_ERROR_STOP=1 -c 'create extension if not exists vector'
          psql "$PGADMIN_TARGET_URL" -v ON_ERROR_STOP=1 -c 'create extension if not exists pgcrypto'
          psql "$PGADMIN_TARGET_URL" -v ON_ERROR_STOP=1 -c 'create extension if not exists "uuid-ossp"'
          not_a_member="$(psql "$PGADMIN_URL" -Atqc "select not pg_has_role('supabase_like', 'authenticated', 'member')")"
          if [ "$not_a_member" != "t" ]; then
            echo "supabase_like must not start out as a member of authenticated."
            exit 1
          fi
      - name: Deploy complete migration history as the non-superuser role
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Confirm the old grant-to-current_user pattern is gone
        shell: bash
        run: |
          set -euo pipefail
          # Regression control (coverage A): granting a temporary role to the
          # connected session's own role, however well-intentioned, is exactly what
          # a hosted Postgres provider can terminate the connection over -- see
          # scripts/ci/run-rls-check.sh's header comment. Neither client-run
          # assertions file may reintroduce it.
          if grep -Eq 'grant\s+\S+\s+to\s+current_user' tests/rls/isolation.sql tests/rls/calendar-booking-isolation.sql; then
            echo "::error::A client-run RLS assertions file grants a role to current_user again."
            exit 1
          fi
          echo "Confirmed: neither client-run assertions file grants anything to current_user."
      - name: Run the corrected staging RLS and tenant invariant checks through dedicated LOGIN roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/staging/release-invariants.sql
          bash scripts/ci/run-rls-check.sh iso tests/rls/isolation-grants.sql tests/rls/isolation-revokes.sql tests/rls/isolation-fixtures.sql tests/rls/isolation-cleanup.sql tests/rls/isolation.sql tests/rls/isolation-grants-verify.sql
          bash scripts/ci/run-rls-check.sh cal tests/rls/calendar-booking-grants.sql tests/rls/calendar-booking-revokes.sql tests/rls/calendar-booking-fixtures.sql tests/rls/calendar-booking-cleanup.sql tests/rls/calendar-booking-isolation.sql tests/rls/calendar-booking-grants-verify.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/integration/tenant-relationship-integrity.sql
        env:
          ADMIN_URL: postgresql://supabase_like:supabase_like@localhost:5432/rls_non_superuser
      - name: Force a client assertion failure and confirm cleanup still leaves no residue
        shell: bash
        run: |
          set -euo pipefail
          # Regression control (coverage H): a deliberately-failing assertions file,
          # run through the same harness and real fixtures, must still leave no
          # role/fixture residue behind even though the assertions themselves fail.
          cat tests/rls/isolation.sql > /tmp/forced-failure-assertions.sql
          echo "do \$\$ begin raise exception 'deliberate forced failure for cleanup regression coverage'; end \$\$;" >> /tmp/forced-failure-assertions.sql
          if bash scripts/ci/run-rls-check.sh isof tests/rls/isolation-grants.sql tests/rls/isolation-revokes.sql tests/rls/isolation-fixtures.sql tests/rls/isolation-cleanup.sql /tmp/forced-failure-assertions.sql tests/rls/isolation-grants-verify.sql; then
            echo "::error::The deliberately-failing assertions file unexpectedly succeeded."
            exit 1
          fi
          echo "Confirmed: the forced assertion failure propagated as a real failure."
        env:
          ADMIN_URL: postgresql://supabase_like:supabase_like@localhost:5432/rls_non_superuser
      - name: Force a client login failure and confirm cleanup still leaves no residue
        shell: bash
        run: |
          set -euo pipefail
          # Regression control (coverage I): the client connection never even
          # authenticates here (RLS_CHECK_FORCE_LOGIN_FAILURE deliberately connects
          # with the wrong password); cleanup must still remove the role.
          if RLS_CHECK_FORCE_LOGIN_FAILURE=1 bash scripts/ci/run-rls-check.sh isol tests/rls/isolation-grants.sql tests/rls/isolation-revokes.sql tests/rls/isolation-fixtures.sql tests/rls/isolation-cleanup.sql tests/rls/isolation.sql tests/rls/isolation-grants-verify.sql; then
            echo "::error::The deliberately-wrong-password client connection unexpectedly succeeded."
            exit 1
          fi
          echo "Confirmed: the forced login failure propagated as a real failure."
        env:
          ADMIN_URL: postgresql://supabase_like:supabase_like@localhost:5432/rls_non_superuser
      - name: Confirm no residue survives success or failure
        shell: bash
        run: |
          set -euo pipefail
          leftover_roles="$(psql "$PGADMIN_URL" -Atqc "select count(*) from pg_roles where rolname like 'rls\_%' escape '\'")"
          if [ "$leftover_roles" != "0" ]; then
            echo "Temporary test role(s) leaked past cleanup."
            exit 1
          fi
          leftover_membership="$(psql "$PGADMIN_URL" -Atqc "select count(*) from pg_auth_members am join pg_roles r on r.oid = am.roleid where r.rolname like 'rls\_%' escape '\'")"
          if [ "$leftover_membership" != "0" ]; then
            echo "Temporary test role membership leaked past cleanup."
            exit 1
          fi
          leftover_fixtures="$(psql "$PGADMIN_TARGET_URL" -Atqc "select count(*) from organizations where id in ('11111111-0000-4000-8000-000000000000', '22222222-0000-4000-8000-000000000000', '31111111-0000-4000-8000-000000000000', '32222222-0000-4000-8000-000000000000')")"
          if [ "$leftover_fixtures" != "0" ]; then
            echo "Temporary RLS test fixtures leaked past cleanup."
            exit 1
          fi
          leftover_integrity_fixtures="$(psql "$PGADMIN_TARGET_URL" -Atqc "select count(*) from organizations where id in ('20000000-0000-4000-8000-000000000001', '20000000-0000-4000-8000-000000000002')")"
          if [ "$leftover_integrity_fixtures" != "0" ]; then
            echo "Temporary tenant-relationship-integrity fixtures leaked past rollback."
            exit 1
          fi
          # A fresh connection (not the one that ran tenant-relationship-integrity.sql)
          # confirming FORCE ROW LEVEL SECURITY reverted with the transaction, exactly
          # as ordinary transactional DDL rollback guarantees -- not something that
          # needed, or got, any separate manual cleanup.
          force_rls_restored="$(psql "$PGADMIN_TARGET_URL" -Atqc "select relforcerowsecurity from pg_class where oid = 'public.conversation_documents'::regclass")"
          if [ "$force_rls_restored" != "t" ]; then
            echo "FORCE ROW LEVEL SECURITY on conversation_documents did not survive rollback."
            exit 1
          fi

  baseline-migration-repro:
    name: Initial baseline idempotency and failure-clarity
    runs-on: ubuntu-latest
    needs: [prisma-generate]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply the raw baseline SQL directly on a clean database
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          # Running the file through psql instead of `prisma migrate deploy`
          # surfaces the real Postgres error text for any statement that
          # fails, instead of the generic "current transaction is aborted"
          # message Prisma reports for every statement after the real one.
          psql "$PGURL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260701000000_initial_baseline/migration.sql
      - name: Reproduce a partially-applied baseline and confirm recovery
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leftover_baseline
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/leftover_baseline
        run: |
          set -euo pipefail
          # This reproduces the exact staging incident: a database that
          # already has one baseline object (e.g. left over from a database
          # that was provisioned with `prisma db push` before migrations
          # existed, or from an earlier interrupted migration attempt) must
          # not make `prisma migrate deploy` fail.
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'create database leftover_baseline'
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'create type "Locale" as enum ('"'"'EN'"'"', '"'"'FI'"'"', '"'"'AR'"'"')'
          npx prisma migrate deploy
          npx prisma migrate status

  migration-upgrade:
    name: Legacy, drift, and policy migration tests
    runs-on: ubuntu-latest
    needs: [prisma-generate]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create isolated migration test databases
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          for database in legacy_template partial_schema storage_policy; do
            psql "$PGURL" -v ON_ERROR_STOP=1 -c "create database $database"
          done
      - name: Provision one deterministic legacy template and clone drift cases
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legacy_template
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/legacy_template
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          bash scripts/ci/provision-legacy-database.sh
          databases="legacy_upgrade drifted_schema missing_column column_drift fk_wrong_source fk_wrong_target fk_not_valid fk_legacy_already_final fk_legacy_wrong_update_action fk_legacy_wrong_delete_action fk_legacy_not_valid fk_legacy_deferrable fk_state_no_table fk_state_pending fk_state_applied fk_state_unfinished fk_state_rolled_back fk_state_final_applied missing_table_allowlist_absent missing_table_allowlist_bad_column missing_table_allowlist_bad_fk weak_policy weak_messages weak_prompts weak_calendar wrong_policy_role wrong_policy_command"
          for database in $databases; do
            psql "$PGURL" -v ON_ERROR_STOP=1 -c "create database $database with template legacy_template"
          done
      - name: Verify the legacy missing-table allowlist remains fail-closed
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node tests/migrations/legacy-missing-table-contract.mjs
      - name: Upgrade deterministic legacy schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legacy_upgrade
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/legacy_upgrade
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/legacy_upgrade
        run: |
          # `prisma db push` against the pinned legacy schema (which already models
          # conversation_documents with today's composite foreign keys) reconstructs
          # conversation_documents_organization_id_fkey with Prisma's current default
          # referential actions (ON UPDATE CASCADE), not the ON UPDATE NO ACTION a real,
          # continuously-migrated production database still carries at this point --
          # so this step exercises the primary (non-override) branch of the FK check,
          # not the legacy override itself. The override's exact tolerance boundary is
          # covered directly below by the fk_legacy_* scenarios, which force the real
          # historical value onto a clone regardless of what this template contains.
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql
          npx prisma migrate deploy
          npx prisma migrate status
          # 20260729000000_conversation_documents_organization_fk_on_update must have
          # corrected the constraint for real by the end of this deploy.
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "do \$\$ begin if (select confupdtype from pg_constraint where conname = 'conversation_documents_organization_id_fkey') <> 'c' then raise exception 'conversation_documents_organization_id_fkey was not upgraded to ON UPDATE CASCADE'; end if; end \$\$"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/staging/release-invariants.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/staging/release-invariants.sql
          bash scripts/ci/run-rls-check.sh iso tests/rls/isolation-grants.sql tests/rls/isolation-revokes.sql tests/rls/isolation-fixtures.sql tests/rls/isolation-cleanup.sql tests/rls/isolation.sql tests/rls/isolation-grants-verify.sql
          bash scripts/ci/run-rls-check.sh cal tests/rls/calendar-booking-grants.sql tests/rls/calendar-booking-revokes.sql tests/rls/calendar-booking-fixtures.sql tests/rls/calendar-booking-cleanup.sql tests/rls/calendar-booking-isolation.sql tests/rls/calendar-booking-grants-verify.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/integration/tenant-relationship-integrity.sql
      - name: Accept an already-corrected foreign key without needing the legacy override
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fk_legacy_already_final
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fk_legacy_already_final
        run: |
          # Simulates a database where this FK was already corrected out-of-band
          # before this deploy; the primary (non-override) branch of the FK check
          # must accept it on its own, proving the override is additive tolerance
          # and not required for the final state to pass.
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'alter table public.conversation_documents drop constraint conversation_documents_organization_id_fkey, add constraint conversation_documents_organization_id_fkey foreign key (organization_id) references public.organizations(id) on delete cascade on update cascade'
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql
          npx prisma migrate deploy
          npx prisma migrate status
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "do \$\$ begin if (select confupdtype from pg_constraint where conname = 'conversation_documents_organization_id_fkey') <> 'c' then raise exception 'already-final conversation_documents_organization_id_fkey was disturbed'; end if; end \$\$"
      - name: Reject a partially provisioned schema atomically
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/partial_schema
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/partial_schema
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/migrations/supabase-compatibility.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'create table public.users (id uuid primary key)'
          if npx prisma migrate deploy; then
            echo "A partial schema was unexpectedly accepted."
            exit 1
          fi
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "do \$\$ begin if to_regclass('public.organizations') is not null then raise exception 'partial migration was not atomic'; end if; end \$\$"
      - name: Reject legacy structural drift before writes
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drifted_schema
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/drifted_schema
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'alter table public.organizations alter column slug drop not null'
          if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql; then
            echo "The read-only preflight unexpectedly accepted drift."
            exit 1
          fi
          if npx prisma migrate deploy; then
            echo "The baseline unexpectedly accepted drift."
            exit 1
          fi
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "do \$\$ begin if (select attnotnull from pg_attribute where attrelid = 'public.organizations'::regclass and attname = 'slug') then raise exception 'drift was rewritten'; end if; end \$\$"
      - name: Reject missing and type-drifted columns before writes
        shell: bash
        run: |
          set -euo pipefail
          reject_column_drift() {
            local database="$1"
            local mutation="$2"
            local assertion="$3"
            export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$database"
            export DIRECT_URL="$DATABASE_URL"
            psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$mutation"
            if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql; then
              echo "Preflight unexpectedly accepted column drift in $database."
              exit 1
            fi
            if npx prisma migrate deploy; then
              echo "Initial baseline unexpectedly accepted column drift in $database."
              exit 1
            fi
            psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$assertion"
          }
          reject_column_drift missing_column 'alter table public.contacts drop column phone' "do \$\$ begin if exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'contacts' and column_name = 'phone') then raise exception 'missing column was recreated'; end if; end \$\$"
          reject_column_drift column_drift 'alter table public.contacts alter column phone type varchar(255)' "do \$\$ begin if (select format_type(atttypid, atttypmod) from pg_attribute where attrelid = 'public.contacts'::regclass and attname = 'phone') <> 'character varying(255)' then raise exception 'column drift was rewritten'; end if; end \$\$"
      - name: Reject incorrect foreign-key definitions before writes
        shell: bash
        run: |
          set -euo pipefail
          reject_fk_drift() {
            local database="$1"
            local mutation="$2"
            local assertion="$3"
            export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$database"
            export DIRECT_URL="$DATABASE_URL"
            psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$mutation"
            if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql; then
              echo "Preflight unexpectedly accepted foreign-key drift in $database."
              exit 1
            fi
            if npx prisma migrate deploy; then
              echo "Initial baseline unexpectedly accepted foreign-key drift in $database."
              exit 1
            fi
            psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$assertion"
          }
          reject_fk_drift fk_wrong_source 'alter table public.contacts drop constraint contacts_organization_id_fkey, add constraint contacts_organization_id_fkey foreign key (company_id) references public.organizations(id) on delete cascade on update cascade' "do \$\$ begin if pg_get_constraintdef((select oid from pg_constraint where conname = 'contacts_organization_id_fkey')) not like 'FOREIGN KEY (company_id)%' then raise exception 'wrong source FK was rewritten'; end if; end \$\$"
          reject_fk_drift fk_wrong_target 'alter table public.contacts drop constraint contacts_organization_id_fkey, add constraint contacts_organization_id_fkey foreign key (organization_id) references public.users(id) on delete cascade on update cascade' "do \$\$ begin if pg_get_constraintdef((select oid from pg_constraint where conname = 'contacts_organization_id_fkey')) not like '%REFERENCES users(id)%' then raise exception 'wrong target FK was rewritten'; end if; end \$\$"
          reject_fk_drift fk_not_valid 'alter table public.contacts drop constraint contacts_organization_id_fkey, add constraint contacts_organization_id_fkey foreign key (organization_id) references public.organizations(id) on delete cascade on update cascade not valid' "do \$\$ begin if (select convalidated from pg_constraint where conname = 'contacts_organization_id_fkey') then raise exception 'NOT VALID FK was rewritten'; end if; end \$\$"
          # The next four all target conversation_documents_organization_id_fkey --
          # the one constraint with a narrow legacy override -- to prove that override
          # tolerates exactly ON UPDATE NO ACTION and nothing else: a different update
          # action, a different delete action, an unvalidated constraint, or a
          # deferrable constraint must all still fail closed even though they share
          # the same constraint name the override names.
          reject_fk_drift fk_legacy_wrong_update_action 'alter table public.conversation_documents drop constraint conversation_documents_organization_id_fkey, add constraint conversation_documents_organization_id_fkey foreign key (organization_id) references public.organizations(id) on delete cascade on update set null' "do \$\$ begin if (select confupdtype from pg_constraint where conname = 'conversation_documents_organization_id_fkey') <> 'n' then raise exception 'wrong legacy update-action FK was rewritten'; end if; end \$\$"
          reject_fk_drift fk_legacy_wrong_delete_action 'alter table public.conversation_documents drop constraint conversation_documents_organization_id_fkey, add constraint conversation_documents_organization_id_fkey foreign key (organization_id) references public.organizations(id) on delete restrict on update no action' "do \$\$ begin if (select confdeltype from pg_constraint where conname = 'conversation_documents_organization_id_fkey') <> 'r' then raise exception 'wrong legacy delete-action FK was rewritten'; end if; end \$\$"
          reject_fk_drift fk_legacy_not_valid 'alter table public.conversation_documents drop constraint conversation_documents_organization_id_fkey, add constraint conversation_documents_organization_id_fkey foreign key (organization_id) references public.organizations(id) on delete cascade on update no action not valid' "do \$\$ begin if (select convalidated from pg_constraint where conname = 'conversation_documents_organization_id_fkey') then raise exception 'unvalidated legacy FK was rewritten'; end if; end \$\$"
          reject_fk_drift fk_legacy_deferrable 'alter table public.conversation_documents drop constraint conversation_documents_organization_id_fkey, add constraint conversation_documents_organization_id_fkey foreign key (organization_id) references public.organizations(id) on delete cascade on update no action deferrable' "do \$\$ begin if not (select condeferrable from pg_constraint where conname = 'conversation_documents_organization_id_fkey') then raise exception 'deferrable legacy FK was rewritten'; end if; end \$\$"
      - name: Verify the legacy FK override is gated by governing-migration-applied state
        shell: bash
        run: |
          set -euo pipefail
          legacy_fk_sql='alter table public.conversation_documents drop constraint conversation_documents_organization_id_fkey, add constraint conversation_documents_organization_id_fkey foreign key (organization_id) references public.organizations(id) on delete cascade on update no action'
          governing_migration='20260729000000_conversation_documents_organization_fk_on_update'

          # A: a genuinely legacy database -- no _prisma_migrations table at all --
          # must still be tolerated; absence of the tracking table is not evidence the
          # migration ran.
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fk_state_no_table"
          export DIRECT_URL="$DATABASE_URL"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$legacy_fk_sql"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'drop table public._prisma_migrations'
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql

          # B: _prisma_migrations exists (from the eight already-resolved published
          # migrations) but has no row at all for the governing migration -- the
          # ordinary not-yet-deployed legacy-upgrade state -- must still be tolerated.
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fk_state_pending"
          export DIRECT_URL="$DATABASE_URL"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$legacy_fk_sql"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql

          # C: once the governing migration is recorded as successfully applied
          # (finished_at set, rolled_back_at null), the exact same legacy value is a
          # real regression, not history -- the preflight must fail, and (since the
          # baseline migration embeds this identical check) `prisma migrate deploy`
          # must fail too, before rewriting anything.
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fk_state_applied"
          export DIRECT_URL="$DATABASE_URL"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$legacy_fk_sql"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "insert into public._prisma_migrations (id, checksum, migration_name, started_at, finished_at, applied_steps_count) values ('11111111-1111-1111-1111-111111111111', repeat('0', 64), '$governing_migration', now(), now(), 1)"
          if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql; then
            echo "Preflight unexpectedly accepted NO ACTION after the governing migration was recorded applied."
            exit 1
          fi
          if npx prisma migrate deploy; then
            echo "prisma migrate deploy unexpectedly accepted NO ACTION after the governing migration was recorded applied."
            exit 1
          fi
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "do \$\$ begin if (select confupdtype from pg_constraint where conname = 'conversation_documents_organization_id_fkey') <> 'a' then raise exception 'malformed constraint was rewritten instead of being rejected'; end if; end \$\$"

          # D1: a row that started but never finished (finished_at NULL) must NOT
          # count as successfully applied -- this exercises Prisma's own
          # migration-history semantics, not a special case we invented, so the
          # tolerance must still apply.
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fk_state_unfinished"
          export DIRECT_URL="$DATABASE_URL"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$legacy_fk_sql"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "insert into public._prisma_migrations (id, checksum, migration_name, started_at, applied_steps_count) values ('22222222-2222-2222-2222-222222222222', repeat('0', 64), '$governing_migration', now(), 0)"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql

          # D2: a row that finished but was later rolled back must NOT count as
          # successfully applied either.
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fk_state_rolled_back"
          export DIRECT_URL="$DATABASE_URL"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$legacy_fk_sql"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "insert into public._prisma_migrations (id, checksum, migration_name, started_at, finished_at, rolled_back_at, applied_steps_count) values ('33333333-3333-3333-3333-333333333333', repeat('0', 64), '$governing_migration', now(), now(), now(), 1)"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql

          # E: the final ON UPDATE CASCADE definition always passes regardless of
          # whether the governing migration is recorded yet -- it matches the
          # contract directly and never needs the override.
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fk_state_final_applied"
          export DIRECT_URL="$DATABASE_URL"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "insert into public._prisma_migrations (id, checksum, migration_name, started_at, finished_at, applied_steps_count) values ('44444444-4444-4444-4444-444444444444', repeat('0', 64), '$governing_migration', now(), now(), 1)"
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql
      - name: Reject a same-name weakened tenant policy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weak_policy
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/weak_policy
        run: |
          alter_sql='alter policy contacts_select on public.contacts using (true)'
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$alter_sql"
          if npx prisma migrate deploy; then
            echo "The security baseline unexpectedly accepted a weak policy."
            exit 1
          fi
          psql "$DIRECT_URL" -Atqc "select qual from pg_policies where schemaname = 'public' and tablename = 'contacts' and policyname = 'contacts_select'" | grep -qx 'true'
      - name: Reject special-policy predicate, role, and command drift atomically
        shell: bash
        run: |
          set -euo pipefail
          reject_policy_drift() {
            local database="$1"
            local mutation="$2"
            local assertion="$3"
            export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$database"
            export DIRECT_URL="$DATABASE_URL"
            psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$mutation"
            if npx prisma migrate deploy; then
              echo "Security baseline unexpectedly accepted policy drift in $database."
              exit 1
            fi
            psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c "$assertion"
          }
          reject_policy_drift weak_messages 'alter policy messages_select on public.messages using (auth.uid() is not null)' "do \$\$ begin if (select qual from pg_policies where tablename = 'messages' and policyname = 'messages_select') not like '%IS NOT NULL%' then raise exception 'messages policy was replaced'; end if; end \$\$"
          reject_policy_drift weak_prompts 'alter policy prompts_select on public.prompts using (auth.uid() is not null)' "do \$\$ begin if (select qual from pg_policies where tablename = 'prompts' and policyname = 'prompts_select') not like '%IS NOT NULL%' then raise exception 'prompts policy was replaced'; end if; end \$\$"
          reject_policy_drift weak_calendar 'alter policy availability_rules_select on public.availability_rules using (auth.uid() is not null)' "do \$\$ begin if (select qual from pg_policies where tablename = 'availability_rules' and policyname = 'availability_rules_select') not like '%IS NOT NULL%' then raise exception 'calendar policy was replaced'; end if; end \$\$"
          reject_policy_drift wrong_policy_role 'alter policy contacts_select on public.contacts to public' "do \$\$ begin if (select roles from pg_policies where tablename = 'contacts' and policyname = 'contacts_select') <> array['public']::name[] then raise exception 'policy role was replaced'; end if; end \$\$"
          reject_policy_drift wrong_policy_command 'drop policy contacts_select on public.contacts; create policy contacts_select on public.contacts for delete to authenticated using (organization_id = auth_org_id())' "do \$\$ begin if (select cmd from pg_policies where tablename = 'contacts' and policyname = 'contacts_select') <> 'DELETE' then raise exception 'policy command was replaced'; end if; end \$\$"
      - name: Verify storage compatibility and reject weak policy drift
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/storage_policy
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/migrations/supabase-compatibility.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/migrations/storage-fixture.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/004_storage.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/004_storage.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/staging/storage-invariants.sql
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'alter policy storage_org_read on storage.objects using (true)'
          if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/004_storage.sql; then
            echo "Storage compatibility unexpectedly accepted a weak policy."
            exit 1
          fi
          psql "$DIRECT_URL" -Atqc "select qual from pg_policies where schemaname = 'storage' and tablename = 'objects' and policyname = 'storage_org_read'" | grep -qx 'true'

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [prisma-generate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with placeholder env
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_APP_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

  production-dependency-audit:
    name: Production dependency security audit
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Blocking production dependency audit
        run: npm audit --omit=dev --audit-level=high

  full-dependency-audit-report:
    name: Full dependency audit report
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full dependency audit report
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Save full dependency audit JSON
        continue-on-error: true
        run: npm audit --audit-level=high --json > npm-audit-full.json
      - name: Upload full audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: npm-audit-full.json
          if-no-files-found: warn
          retention-days: 30

  i18n:
    name: i18n key parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check locale key parity
        run: node scripts/check-i18n-parity.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate secret-scan commit range
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "$BASE_SHA" =~ $sha_pattern || ! "$HEAD_SHA" =~ $sha_pattern ]]; then
            echo "Secret scan requires exact lowercase 40-character commit SHAs."
            exit 1
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
      - name: Secret scan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/repo" "ghcr.io/gitleaks/gitleaks:v$GITLEAKS_VERSION" git --no-banner --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA" /repo

  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    needs:
      - install
      - prisma-generate
      - prisma-validate
      - migration-structure
      - lint
      - typecheck
      - tests
      - rls
      - rls-non-superuser
      - baseline-migration-repro
      - migration-upgrade
      - build
      - production-dependency-audit
      - full-dependency-audit-report
      - i18n
      - secret-scan
    if: always()
    steps:
      - name: Verify required CI jobs
        shell: bash
        run: |
          set -euo pipefail
          results='${{ toJson(needs) }}'
          if ! echo "$results" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "$results"
            exit 1
          fi
          echo "All required CI jobs completed successfully."
