name: Production release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character main SHA validated on staging"
        required: true
        type: string
      confirm_production_sha:
        description: "Retype the exact candidate SHA to confirm production"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  VERCEL_CLI_VERSION: "56.3.2"
  # The canonical production domain (NEXT_PUBLIC_APP_URL). The release must
  # prove this domain -- not only vars.PROD_URL -- serves the candidate.
  PROD_CANONICAL_URL: https://syveka.com

jobs:
  verify-release-chain:
    name: Verify immutable release chain
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.verify.outputs.candidate_sha }}
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify main, CI, staging, and manual confirmation
        id: verify
        run: npx tsx scripts/verify-release-chain.ts
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRM_PRODUCTION_SHA: ${{ inputs.confirm_production_sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_API_URL: ${{ github.api_url }}
          RELEASE_MAIN_BRANCH: main
          RELEASE_CI_WORKFLOW: ci.yml
          RELEASE_STAGING_WORKFLOW: staging-release.yml

  migrate-and-deploy:
    name: Migrate and deploy production
    runs-on: ubuntu-latest
    needs: [verify-release-chain]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout immutable production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release-chain.outputs.candidate_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$EXPECTED_CANDIDATE_SHA" ]; then
            echo "Checked-out SHA does not match the verified production candidate."
            exit 1
          fi
        env:
          EXPECTED_CANDIDATE_SHA: ${{ needs.verify-release-chain.outputs.candidate_sha }}

      - name: Read-only legacy compatibility preflight
        run: psql "$PROD_DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/006_legacy_baseline_preflight.sql
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Apply Prisma migrations once
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Verify migration status
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Apply rerunnable Supabase Storage compatibility
        run: psql "$PROD_DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/sql/004_storage.sql
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      - name: Verify production database invariants
        run: |
          psql "$PROD_DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/staging/release-invariants.sql
          psql "$PROD_DIRECT_URL" -v ON_ERROR_STOP=1 -f tests/staging/storage-invariants.sql
        env:
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

      # --- Vercel build, staged deploy, verified promotion ------------------
      # VERCEL_TOKEN can deploy to production, so it is only ever in the
      # environment of steps that run the Vercel CLI (`pull`/`deploy`/
      # `promote`) or read-only Vercel API calls -- never in a step that runs
      # repository code. `vercel build` runs `next build`, so it has no
      # credential. The candidate is deployed with --skip-domain (STAGED),
      # checked, then promoted explicitly, and the release only succeeds once
      # the production domains are proven to serve the candidate's build SHA.
      # tests/unit/production-workflow-release-hardening.test.ts enforces this.
      - name: Pull production config (Vercel credentials)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"
          guard_token="$VERCEL_TOKEN"
          # >>> token-persistence guard (identical in deploy.yml and staging-release.yml)
          # Fails closed if the token is found anywhere `vercel pull` or the CLI
          # could have written it. Reports only the file path and, for dotenv
          # files, the KEY name -- never a value, line, hash or fragment.
          if [ -z "$guard_token" ] || [[ "$guard_token" == *$'\n'* || "$guard_token" == *$'\r'* ]]; then
            echo "Token guard: the Vercel token is empty or multi-line; refusing to build."
            exit 1
          fi
          guard_hits=0
          for guard_root in .vercel "$HOME/.local/share/com.vercel.cli" "$HOME/.vercel"; do
            [ -e "$guard_root" ] || continue
            if [ "$guard_root" = ".vercel" ]; then
              guard_category=".vercel (vercel pull output)"
            else
              guard_category="Vercel CLI config"
            fi
            if [ -n "$(find "$guard_root" ! -readable -print -quit 2>/dev/null)" ]; then
              echo "Token guard: $guard_category contains unreadable entries; refusing to build."
              guard_hits=$((guard_hits + 1))
            fi
            while IFS= read -r -d '' guard_file; do
              guard_rc=0
              grep -qF -- "$guard_token" "$guard_file" || guard_rc=$?
              [ "$guard_rc" -eq 1 ] && continue
              guard_hits=$((guard_hits + 1))
              guard_path="${guard_file//"$guard_token"/[REDACTED]}"
              guard_path="$(printf '%s' "$guard_path" | LC_ALL=C tr -c '[:print:]' '?')"
              if [ "$guard_rc" -ne 0 ]; then
                echo "Token guard: could not read $guard_category file: $guard_path"
                continue
              fi
              echo "Token guard: token value found in $guard_category file: $guard_path"
              case "${guard_file##*/}" in
                .env | .env.* | *.env)
                  GUARD_TOKEN="$guard_token" LC_ALL=C awk '
                    index($0, ENVIRON["GUARD_TOKEN"]) {
                      if (match($0, /^[ \t]*(export[ \t]+)?[A-Za-z_][A-Za-z0-9_]*=/)) {
                        key = substr($0, RSTART, RLENGTH - 1)
                        sub(/^[ \t]*(export[ \t]+)?/, "", key)
                        if (index(key, ENVIRON["GUARD_TOKEN"])) key = "[REDACTED]"
                        print "Token guard:   in variable " key
                      } else {
                        print "Token guard:   on line " NR " (not a KEY=VALUE line)"
                      }
                    }' "$guard_file" | sort -u
                  ;;
              esac
            done < <(find "$guard_root" -type f -print0 2>/dev/null)
          done
          if [ "$guard_hits" -ne 0 ]; then
            echo "Token guard: the Vercel token was persisted to disk ($guard_hits finding(s)); refusing to build."
            exit 1
          fi
          # <<< token-persistence guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build immutable production deployment (no Vercel credentials)
        shell: bash
        run: |
          set -euo pipefail
          app_url="$(node --env-file=.vercel/.env.production.local -e 'process.stdout.write(process.env.NEXT_PUBLIC_APP_URL ?? "")')"
          if [ "$app_url" != "$PROD_CANONICAL_URL" ]; then
            echo "The production NEXT_PUBLIC_APP_URL is not $PROD_CANONICAL_URL."
            exit 1
          fi
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod
        env:
          # Inlined into /api/health's `build` field so the promoted domains
          # can be proven to serve this exact commit.
          NEXT_PUBLIC_BUILD_SHA: ${{ needs.verify-release-chain.outputs.candidate_sha }}

      - name: Record the current production deployment (Vercel credentials)
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous_id=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" |
            jq -r '.targets.production.id // empty')
          if [[ ! "$previous_id" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "Could not read the current production deployment (the rollback target)."
            exit 1
          fi
          echo "id=$previous_id" >> "$GITHUB_OUTPUT"
          echo "Rollback target (currently live): $previous_id"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy the candidate as a staged production deployment (Vercel credentials)
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          if [[ ! "$deployment_url" =~ ^https://[a-z0-9.-]+\.vercel\.app$ ]]; then
            echo "Vercel did not return an HTTPS deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify the staged candidate deployment (Vercel credentials)
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          info=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_URL#https://}?teamId=$VERCEL_ORG_ID")
          deployment_id=$(jq -r '.id // empty' <<<"$info")
          project_id=$(jq -r '.projectId // empty' <<<"$info")
          ready_state=$(jq -r '.readyState // empty' <<<"$info")
          ready_substate=$(jq -r '.readySubstate // empty' <<<"$info")
          target=$(jq -r '.target // empty' <<<"$info")
          commit_sha=$(jq -r '.meta.githubCommitSha // .meta.gitCommitSha // empty' <<<"$info")
          echo "Candidate $deployment_id: readyState=$ready_state readySubstate=$ready_substate target=$target sha=$commit_sha"
          if [[ ! "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]] ||
            [ "$project_id" != "$VERCEL_PROJECT_ID" ] ||
            [ "$ready_state" != "READY" ] ||
            [ "$ready_substate" != "STAGED" ] ||
            [ "$target" != "production" ] ||
            [ "$commit_sha" != "$CANDIDATE_SHA" ]; then
            echo "The staged deployment is not a READY, STAGED production deployment of $CANDIDATE_SHA in this project."
            exit 1
          fi
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CANDIDATE_SHA: ${{ needs.verify-release-chain.outputs.candidate_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Check the staged candidate before promotion
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not configured for the production environment;" \
                 "the staged deployment sits behind Vercel Deployment Protection and cannot be checked."
            exit 1
          fi
          max_attempts=30
          for attempt in $(seq 1 "$max_attempts"); do
            body_file=$(mktemp)
            status=$(curl --silent --max-time 15 --connect-timeout 10 -o "$body_file" -w '%{http_code}' \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$DEPLOYMENT_URL/api/health") || status=000
            body=$(head -c 500 "$body_file" 2>/dev/null)
            rm -f "$body_file"
            if [ "$status" = "200" ] && [[ "$body" == *"\"status\":\"healthy\""* ]] &&
              [[ "$body" == *"\"build\":\"$CANDIDATE_SHA\""* ]]; then
              echo "Staged candidate is healthy and reports $CANDIDATE_SHA (attempt $attempt/$max_attempts): $body"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts: status=$status body=$body"
            sleep 10
          done
          echo "The staged candidate did not report a healthy $CANDIDATE_SHA within ~5 minutes; not promoting."
          exit 1
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          CANDIDATE_SHA: ${{ needs.verify-release-chain.outputs.candidate_sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Promote the verified candidate (Vercel credentials)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" promote "$CANDIDATE_DEPLOYMENT_ID" --timeout 5m --yes --token="$VERCEL_TOKEN"
        env:
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.candidate.outputs.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify the production domains point at the candidate (Vercel credentials)
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1?teamId=$VERCEL_ORG_ID"
          }
          live_id=$(api "/v9/projects/$VERCEL_PROJECT_ID" | jq -r '.targets.production.id // empty')
          ready_substate=$(api "/v13/deployments/$CANDIDATE_DEPLOYMENT_ID" | jq -r '.readySubstate // empty')
          echo "Project production deployment: $live_id; candidate readySubstate: $ready_substate"
          if [ "$live_id" != "$CANDIDATE_DEPLOYMENT_ID" ] || [ "$ready_substate" != "PROMOTED" ]; then
            echo "The candidate was not promoted (still STAGED or another deployment is live)."
            exit 1
          fi
          for domain in "${PROD_CANONICAL_URL#https://}" "${PROD_URL#https://}"; do
            aliased_id=$(api "/v4/aliases/$domain" | jq -r '.deploymentId // empty')
            echo "$domain -> $aliased_id"
            if [ "$aliased_id" != "$CANDIDATE_DEPLOYMENT_ID" ]; then
              echo "$domain does not point at the promoted candidate."
              exit 1
            fi
          done
        env:
          CANDIDATE_DEPLOYMENT_ID: ${{ steps.candidate.outputs.id }}
          PROD_URL: ${{ vars.PROD_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prove the production domains serve the candidate build
        shell: bash
        run: |
          set -euo pipefail
          for base_url in "$PROD_CANONICAL_URL" "$PROD_URL"; do
            max_attempts=30
            served=false
            for attempt in $(seq 1 "$max_attempts"); do
              body_file=$(mktemp)
              status=$(curl --silent --max-time 15 --connect-timeout 10 -o "$body_file" -w '%{http_code}' \
                "$base_url/api/health") || status=000
              body=$(head -c 500 "$body_file" 2>/dev/null)
              rm -f "$body_file"
              if [ "$status" = "200" ] && [[ "$body" == *"\"status\":\"healthy\""* ]] &&
                [[ "$body" == *"\"build\":\"$CANDIDATE_SHA\""* ]]; then
                echo "$base_url serves a healthy $CANDIDATE_SHA (attempt $attempt/$max_attempts): $body"
                served=true
                break
              fi
              echo "$base_url attempt $attempt/$max_attempts: status=$status body=$body"
              sleep 10
            done
            if [ "$served" != "true" ]; then
              echo "$base_url did not serve a healthy $CANDIDATE_SHA within ~5 minutes."
              exit 1
            fi
          done
        env:
          CANDIDATE_SHA: ${{ needs.verify-release-chain.outputs.candidate_sha }}
          PROD_URL: ${{ vars.PROD_URL }}

      - name: Print the rollback command
        if: failure() && steps.previous.outputs.id != ''
        shell: bash
        run: |
          {
            echo "### Production release failed after the rollback target was recorded"
            echo
            echo "If the candidate was promoted, restore the previous production deployment with:"
            echo
            echo "\`vercel rollback $PREVIOUS_DEPLOYMENT_ID --timeout 5m --yes\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.id }}
