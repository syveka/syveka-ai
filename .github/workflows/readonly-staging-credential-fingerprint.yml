name: Read-only staging credential fingerprint diagnostic

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Reviewed 40-character Syveka commit SHA to diagnose
        required: true
        type: string

permissions:
  contents: read

jobs:
  fingerprint:
    name: Fingerprint STAGING_DIRECT_URL's password
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging

    steps:
      - name: Validate reviewed commit SHA
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: bash
        run: |
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "REVIEWED_SHA_INVALID"
            exit 1
          fi

      - name: Verify reviewed SHA belongs to the Syveka repository
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "syveka/syveka-ai" ]] || \
            ! gh api "repos/syveka/syveka-ai/git/commits/$REVIEWED_SHA" >/dev/null 2>&1; then
            echo "REPOSITORY_SHA_INVALID"
            exit 1
          fi

      - name: Checkout reviewed trusted ref
        id: checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify checked-out source
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: bash
        run: |
          if [[ "$CHECKOUT_OUTCOME" != "success" ]]; then
            echo "CHECKOUT_FAILED"
            exit 1
          fi

          actual_head="$(git rev-parse HEAD 2>/dev/null || true)"
          reviewed_sha_lower="${REVIEWED_SHA,,}"

          if [[ "$actual_head" != "$reviewed_sha_lower" ]]; then
            echo "SOURCE_VERIFICATION_FAILED"
            exit 1
          fi

      # No database connection of any kind is made here -- this is pure string
      # parsing of the connection string already present in the job's own
      # environment, entirely local to the runner. It cannot touch Supavisor,
      # extend a circuit breaker, or count as an authentication attempt.
      - name: Fingerprint the password segment (no DB connection made)
        env:
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          node -e '
            const { createHash } = require("node:crypto");
            const raw = process.env.STAGING_DIRECT_URL;
            if (!raw) {
              console.log("STAGING_DIRECT_URL_NOT_SET");
              process.exit(1);
            }
            let url;
            try {
              url = new URL(raw.trim());
            } catch {
              console.log("STAGING_DIRECT_URL_UNPARSEABLE");
              process.exit(1);
            }
            const digest = createHash("sha256").update(url.password).digest("hex");
            console.log("STAGING_DIRECT_URL_PASSWORD_FINGERPRINT=" + digest);
          '
