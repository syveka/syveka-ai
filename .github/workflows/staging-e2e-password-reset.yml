# TEMPORARY workflow: rotates the password for exactly one existing staging
# E2E test account (ehabkia62@gmail.com) via the Supabase Admin API. Needed
# because the Supabase Dashboard has no direct "set password" control, and
# the account's normal forgot-password web flow could not be used to reach
# it for this specific account.
#
# Delete this workflow and scripts/reset-staging-e2e-password.mjs once the
# password has been rotated and handed off to STAGING_E2E_USER_PASSWORD.
name: "[TEMP] Staging E2E password reset"

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the 20-character staging Supabase project ref to confirm the target"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-e2e-password-reset
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  TARGET_EMAIL: "ehabkia62@gmail.com"
  REQUIRED_PROJECT_REF: "badkselmhtqglbnszsbz"

jobs:
  reset-password:
    name: Reset staging E2E password
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Refuse unless branch, environment, and project ref all match
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow only runs from main (got $RUN_REF)."
            exit 1
          fi

          if [ "$CONFIRM_PROJECT_REF" != "$REQUIRED_PROJECT_REF" ]; then
            echo "::error::Typed confirmation does not match the required staging project ref."
            exit 1
          fi

          if [ -z "${STAGING_SUPABASE_PROJECT_REF:-}" ] || [ "$STAGING_SUPABASE_PROJECT_REF" != "$REQUIRED_PROJECT_REF" ]; then
            echo "::error::vars.STAGING_SUPABASE_PROJECT_REF does not match the required project ref."
            exit 1
          fi

          if [ -z "${STAGING_SUPABASE_URL:-}" ]; then
            echo "::error::vars.STAGING_SUPABASE_URL is not configured."
            exit 1
          fi

          expected_host="${REQUIRED_PROJECT_REF}.supabase.co"
          actual_host="$(node -e "console.log(new URL(process.env.STAGING_SUPABASE_URL).hostname)")"

          if [ "$actual_host" != "$expected_host" ]; then
            echo "::error::vars.STAGING_SUPABASE_URL host ($actual_host) does not match $expected_host."
            exit 1
          fi

          echo "Branch, environment, and Supabase project ref all confirmed for staging."
        env:
          RUN_REF: ${{ github.ref }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          REQUIRED_PROJECT_REF: ${{ env.REQUIRED_PROJECT_REF }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Reset the E2E account's password and verify nothing else changed
        id: reset
        run: node scripts/reset-staging-e2e-password.mjs
        env:
          TARGET_EMAIL: ${{ env.TARGET_EMAIL }}
          REQUIRED_PROJECT_REF: ${{ env.REQUIRED_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PASSWORD_OUTPUT_FILE: ${{ runner.temp }}/staging-e2e-password.txt

      - name: Upload the generated password (1-day retention, never logged)
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-password-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-e2e-password.txt
          retention-days: 1

      - name: Manual follow-up required
        run: |
          cat <<'EOF'
          Password reset succeeded. Automatic update of the STAGING_E2E_USER_PASSWORD
          secret is NOT possible from this workflow.

          Next steps for a human:
            1. Download the staging-e2e-password artifact from this run.
            2. Set its value as STAGING_E2E_USER_PASSWORD in the staging environment.
            3. Delete the downloaded password file and artifact after copying it.
          EOF
