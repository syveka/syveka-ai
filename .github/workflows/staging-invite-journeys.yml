name: Staging invitation journeys

# Invitation acceptance end to end on staging, for dedicated marked fixtures
# only (scripts/invite-journey-fixtures.ts). Invitations are inserted
# directly, never through inviteMember(), so no invitation email is sent;
# fixture identities are pre-confirmed, so no confirmation email either.
# Each journey then opens the real /invite/<token> page and accepts through
# the real acceptInvitationAction (tests/e2e/invite-journeys.spec.ts).
# Manual dispatch only, gated by the `staging` environment approval.
# action=teardown deletes the fixtures instead of running the journeys.

on:
  workflow_dispatch:
    inputs:
      expected_build_sha:
        description: "40-character SHA the staging app must be serving"
        required: true
        type: string
      staging_project_ref:
        description: "Type the 20-character staging Supabase project ref"
        required: true
        type: string
      action:
        description: "run = journeys (prepare, test, reset); teardown = delete the fixtures"
        required: true
        type: choice
        default: run
        options:
          - run
          - teardown

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-invite-journeys
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  STAGING_STABLE_URL: https://syveka-ai-staging.vercel.app

jobs:
  invite-journeys:
    name: Invitation journeys on staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Validate inputs and refuse non-staging targets
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "Only allowed from main."; exit 1
          fi
          if [[ ! "$EXPECTED_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_build_sha must be a full 40-character lowercase SHA."; exit 1
          fi
          if [ "$ACTION" != "run" ] && [ "$ACTION" != "teardown" ]; then
            echo "action must be run or teardown."; exit 1
          fi
          if [ "$CONFIRM_STAGING_PROJECT_REF" != "$STAGING_SUPABASE_PROJECT_REF" ]; then
            echo "The confirmation input does not match the staging project ref."; exit 1
          fi
          if [ -z "$PRODUCTION_SUPABASE_PROJECT_REF" ] || [ "$STAGING_SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "Staging and production Supabase project refs must be present and different."; exit 1
          fi
        env:
          RUN_REF: ${{ github.ref }}
          EXPECTED_BUILD_SHA: ${{ inputs.expected_build_sha }}
          ACTION: ${{ inputs.action }}
          CONFIRM_STAGING_PROJECT_REF: ${{ inputs.staging_project_ref }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}

      # A staging release redeploys the app and runs its own E2E identity
      # changes and sign-ins (shared auth rate limit); never overlap with one.
      - name: Refuse while a staging release is running
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress waiting pending requested; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/staging-release.yml/runs?status=$status" --jq '.total_count')
            if [ "$count" != "0" ]; then
              echo "A staging release run is $status; refusing to overlap."; exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate staging project identity
        run: node scripts/validate-staging-config.mjs
        env:
          STAGING_CONFIG_MODE: identity
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      - name: Verify the deployed staging build before any change
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --max-time 20 "$STAGING_STABLE_URL/api/health")
          echo "Staging health: $body"
          if [[ "$body" != *'"status":"healthy"'* || "$body" != *'"database":"ok"'* || "$body" != *'"redis":"ok"'* ]]; then
            echo "Staging is not healthy."; exit 1
          fi
          if [[ "$body" != *"\"build\":\"$EXPECTED_BUILD_SHA\""* ]]; then
            echo "Staging is not serving the expected build $EXPECTED_BUILD_SHA."; exit 1
          fi
        env:
          EXPECTED_BUILD_SHA: ${{ inputs.expected_build_sha }}

      - name: Preview the fixtures (read-only)
        run: npx tsx scripts/invite-journey-fixtures.ts preview
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          E2E_USER_EMAIL: ${{ secrets.STAGING_E2E_USER_EMAIL }}

      - name: Prepare the marked fixtures and invitations
        id: prepare
        if: inputs.action == 'run'
        run: npx tsx scripts/invite-journey-fixtures.ts prepare
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          E2E_USER_EMAIL: ${{ secrets.STAGING_E2E_USER_EMAIL }}

      # getEntitlements() caches each org's limits for 60 s; waiting past that
      # makes the seat grant and the read-only state the app sees exactly what
      # prepare just set (ENTITLEMENT_CACHE_WAIT_SECONDS).
      - name: Wait for the entitlement cache to expire
        if: inputs.action == 'run'
        run: sleep 65

      - name: Install Playwright Chromium
        if: inputs.action == 'run'
        run: npx playwright install --with-deps chromium

      # Serial, no retries (a retry could hide a double acceptance), no
      # traces/screenshots/video, and no artifact upload: invitation URLs
      # carry tokens. The spec also checks the database after every journey.
      - name: Run the invitation journeys
        if: inputs.action == 'run'
        run: npx playwright test tests/e2e/invite-journeys.spec.ts --project=desktop --workers=1 --retries=0 --trace=off --reporter=list
        env:
          E2E_INVITE_JOURNEYS: "1"
          E2E_BASE_URL: ${{ env.STAGING_STABLE_URL }}
          E2E_USER_EMAIL: ${{ secrets.STAGING_E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.STAGING_E2E_USER_PASSWORD }}
          E2E_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      - name: Reset the fixtures to their baseline
        if: always() && steps.prepare.outcome != 'skipped'
        run: npx tsx scripts/invite-journey-fixtures.ts reset
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          E2E_USER_EMAIL: ${{ secrets.STAGING_E2E_USER_EMAIL }}

      - name: Delete the fixtures (teardown)
        if: inputs.action == 'teardown'
        run: npx tsx scripts/invite-journey-fixtures.ts teardown
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          E2E_USER_EMAIL: ${{ secrets.STAGING_E2E_USER_EMAIL }}

      - name: Preview the fixtures after cleanup (read-only)
        if: always() && (steps.prepare.outcome != 'skipped' || inputs.action == 'teardown')
        run: npx tsx scripts/invite-journey-fixtures.ts preview
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          E2E_USER_EMAIL: ${{ secrets.STAGING_E2E_USER_EMAIL }}

      - name: Verify staging health after the run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --max-time 20 "$STAGING_STABLE_URL/api/health")
          echo "Staging health: $body"
          if [[ "$body" != *'"status":"healthy"'* || "$body" != *"\"build\":\"$EXPECTED_BUILD_SHA\""* ]]; then
            echo "Staging is not healthy or no longer serves $EXPECTED_BUILD_SHA."; exit 1
          fi
        env:
          EXPECTED_BUILD_SHA: ${{ inputs.expected_build_sha }}
