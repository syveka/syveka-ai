name: Read-only staging auth/membership diagnostic

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: "56.3.2"
  NODE_VERSION: "22"

jobs:
  diagnose:
    name: Diagnose staging auth/membership state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Read-only: scripts/diagnose-staging-auth-membership.ts performs no
      # writes (no user/org/membership create/update/delete, no
      # app_metadata change, no password reset) and is hardcoded to refuse
      # running against any account other than the one it was reviewed for.
      - name: Run read-only auth/membership diagnostic
        run: npx tsx scripts/diagnose-staging-auth-membership.ts
        env:
          DIAGNOSTIC_EMAIL: "Ehabkia62@gmail.com"
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Read-only: `vercel pull` only writes a local, git-ignored env file
      # inside this ephemeral runner (removed at the end of this step) and
      # never deploys or modifies anything. NEXT_PUBLIC_APP_URL is
      # explicitly a public, non-secret value by Next.js's own convention
      # (embedded in client bundles), so printing it is safe; every other
      # line the pulled file could contain is deliberately never printed.
      #
      # Reuses scripts/validate-staging-config.mjs's existing "runtime"
      # mode verbatim -- the same check staging-release.yml already runs
      # right after its own `vercel pull` -- rather than re-implementing
      # the Supabase-project/DATABASE_URL identity comparison here. That
      # mode never interpolates a raw secret value into any message it
      # prints (see the script's own parseUrl() comment); it only ever
      # throws a fixed, safe string, which this step echoes back verbatim
      # on failure, or a fixed success string, so this step's exit code and
      # its own MATCH/MISMATCH line are the only source of truth -- no
      # connection string, token, or key is ever printed by this step.
      - name: "Config-drift check: Vercel Preview vs. staging secrets (read-only)"
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=preview --token="$STAGING_VERCEL_TOKEN" >/dev/null

          if [ ! -f .vercel/.env.preview.local ]; then
            echo "NEXT_PUBLIC_APP_URL: MISSING (could not pull staging Preview environment config)"
            echo "SUPABASE/DATABASE IDENTITY: MISSING (could not pull staging Preview environment config)"
            rm -rf .vercel
            exit 0
          fi

          expected_app_url_line='NEXT_PUBLIC_APP_URL="https://syveka-ai-staging.vercel.app"'
          app_url_line="$(grep -m1 '^NEXT_PUBLIC_APP_URL=' .vercel/.env.preview.local || true)"
          if [ -z "$app_url_line" ]; then
            echo "NEXT_PUBLIC_APP_URL: MISSING"
          elif [ "$app_url_line" = "$expected_app_url_line" ]; then
            echo "NEXT_PUBLIC_APP_URL: MATCH ($app_url_line)"
          else
            echo "NEXT_PUBLIC_APP_URL: MISMATCH ($app_url_line)"
          fi

          if STAGING_CONFIG_MODE=runtime node --env-file=.vercel/.env.preview.local scripts/validate-staging-config.mjs; then
            echo "SUPABASE/DATABASE IDENTITY: MATCH"
          else
            echo "SUPABASE/DATABASE IDENTITY: MISMATCH"
          fi

          # Structural-only DATABASE_URL check: reads the pooling-relevant
          # shape of the value already pulled above (port, pgbouncer/
          # connection_limit query params, and whether the hostname looks
          # like a Supabase pooler endpoint) without ever printing the
          # value itself, its hostname, or any credential -- mirrors the
          # exact safety convention scripts/validate-staging-config.mjs
          # already uses (parseUrl() never interpolates a raw value into
          # any message). Answers whether ensurePgbouncerCompatibility()
          # (src/server/db/connection-string-sanitizer.ts) would activate
          # for the live value, using that function's own exact condition
          # (port === "6543"), not a separate guess.
          node -e '
            const fs = require("fs");
            const line = fs
              .readFileSync(".vercel/.env.preview.local", "utf8")
              .split("\n")
              .find((l) => l.startsWith("DATABASE_URL="));
            if (!line) {
              console.log("DATABASE_URL PORT: missing");
              console.log("PGBOUNCER=TRUE PRESENT: n/a (DATABASE_URL missing)");
              console.log("CONNECTION_LIMIT=1 PRESENT: n/a (DATABASE_URL missing)");
              console.log("SUPABASE POOLER HOSTNAME PATTERN: n/a (DATABASE_URL missing)");
              console.log("ENSUREPGBOUNCERCOMPATIBILITY WOULD ACTIVATE: n/a (DATABASE_URL missing)");
              process.exit(0);
            }
            let raw = line.slice("DATABASE_URL=".length).trim();
            if (raw.startsWith("\"") && raw.endsWith("\"")) raw = raw.slice(1, -1);
            let url;
            try {
              url = new URL(raw);
            } catch {
              console.log("DATABASE_URL PORT: unparseable");
              console.log("PGBOUNCER=TRUE PRESENT: n/a (unparseable)");
              console.log("CONNECTION_LIMIT=1 PRESENT: n/a (unparseable)");
              console.log("SUPABASE POOLER HOSTNAME PATTERN: n/a (unparseable)");
              console.log("ENSUREPGBOUNCERCOMPATIBILITY WOULD ACTIVATE: n/a (unparseable)");
              process.exit(0);
            }
            const port = url.port || "5432 (default, no explicit port)";
            const looksLikePooler = /(^|\.)pooler\.supabase\.com$/i.test(url.hostname) || /supavisor/i.test(url.hostname);
            const wouldActivate = url.port === "6543";
            console.log(`DATABASE_URL PORT: ${port}`);
            console.log(`PGBOUNCER=TRUE PRESENT: ${url.searchParams.get("pgbouncer") === "true" ? "YES" : "NO"}`);
            console.log(`CONNECTION_LIMIT=1 PRESENT: ${url.searchParams.get("connection_limit") === "1" ? "YES" : "NO"}`);
            console.log(`SUPABASE POOLER HOSTNAME PATTERN: ${looksLikePooler ? "YES" : "NO"}`);
            console.log(`ENSUREPGBOUNCERCOMPATIBILITY WOULD ACTIVATE: ${wouldActivate ? "YES" : "NO"}`);
          '

          rm -rf .vercel
        env:
          STAGING_VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
